name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Organiser le projet
        run: |
          set -e
          PKG=app/src/main/java/com/sebtransfer/app
          mkdir -p "$PKG"
          cp ./*.java "$PKG/"
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app.gradle app/build.gradle

      - name: Compiler l'APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            ERR=$(grep -E -A3 "error:" build.log | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Erreur de compilation::$ERR"
            tail -40 build.log
          fi
          exit $CODE

      - uses: actions/upload-artifact@v4
        with:
          name: SebTransfert-apk
          path: app/build/outputs/apk/debug/app-debug.apk
