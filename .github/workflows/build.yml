name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Les fichiers sont à plat à la racine du dépôt : on reconstruit
      # la structure Android standard ici, le temps du build.
      - name: Organiser le projet
        run: |
          set -e
          PKG=app/src/main/java/com/sebtransfer/app
          mkdir -p "$PKG"
          cp ./*.java "$PKG/"
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app.gradle app/build.gradle

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SebTransfert-apk
          path: app/build/outputs/apk/debug/app-debug.apk
